<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Timer</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #28a745;
            color: white;
            font-family: Arial, sans-serif;
        }
        body.training {
            background: #28a745;
        }
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 15px;
            background: rgba(13, 71, 161, 0.95);
            z-index: 100;
        }
        .top-header h2 {
            font-size: 24px;
            margin: 5px 0;
            font-family: Arial, sans-serif;
        }
        .top-header p {
            font-size: 14px;
            margin: 2px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .container {
            width: 95%;
            text-align: center;
            margin: auto;
            margin-top: 120px;
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #28a745;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            display: none;
        }
        .header h2 {
            font-size: 28px;
            margin: 5px 0;
            font-family: Arial, sans-serif;
        }
        .header p {
            font-size: 20px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .settings {
            background: #28a745;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        input {
            width: 80px;
            font-size: 22px;
            text-align: center;
            padding: 8px;
        }
        .training-header {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            display: none;
        }
        .training-header h2 {
            font-size: 28px;
            margin: 5px 0;
            font-family: Arial, sans-serif;
        }
        .training-header p {
            font-size: 20px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        #phase {
            font-size: 42px;
            font-weight: bold;
            margin-top: 20px;
        }
        #timer {
            font-size: 120px;
            font-weight: bold;
        }
        #info {
            font-size: 30px;
            line-height: 1.8;
        }
        button {
            font-size: 22px;
            padding: 15px 25px;
            margin: 8px;
            border-radius: 12px;
            border: 0;
        }
        .start {
            background: #0d47a1;
            color: white;
        }
        .pause {
            background: #ffc107;
        }
        .resume {
            background: #28a745;
            color: white;
        }
        .reset {
            background: #dc3545;
            color: white;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="top-header" id="topHeader">
        <h2>Fitness Timer</h2>
        <p>by Petersen19</p>
    </div>
    <div class="training-header" id="trainingHeader">
        <h2>Fitness Timer</h2>
        <p>by Petersen19</p>
    </div>
    <div class="container">
        <div class="header" id="mainHeader">
            <h2>Fitness Timer</h2>
            <p>by Petersen19</p>
        </div>
        <div id="settings" class="settings">
            Übungsdauer Sekunden<br>
            <input id="work" value="20" type="number">
            <br><br>
            Pause Sekunden<br>
            <input id="rest" value="45" type="number">
            <br><br>
            Wiederholungen<br>
            <input id="rounds" value="20" type="number">
            <br><br>
            Sätze<br>
            <input id="sets" value="3" type="number">
            <br><br>
            Satzpause Sekunden<br>
            <input id="setPause" value="60" type="number">
        </div>
        <div id="phase" class="hidden">BEREIT</div>
        <div id="timer" class="hidden">20</div>
        <div id="info" class="hidden">Wiederholung 1 / 20<br>Satz 1 / 3</div>
        <button class="start" id="startBtn" onclick="startTimer()">START</button>
        <button class="pause hidden" id="pauseBtn" onclick="pauseTimer()">PAUSE</button>
        <button class="resume hidden" id="resumeBtn" onclick="resumeTimer()">FORTSETZEN</button>
        <button class="reset hidden" id="resetBtn" onclick="resetTimer()">RESET</button>
    </div>
    <script>
        let phase = "work"; // work, rest, setpause
        let seconds = 20;
        let round = 1;
        let set = 1;
        let running = false;
        let paused = false;
        let timer = null;
        let wakeLock = null;
        let inCountdown = false;
        let countdownSeconds = 10;
        
        const work = document.getElementById("work");
        const rest = document.getElementById("rest");
        const rounds = document.getElementById("rounds");
        const sets = document.getElementById("sets");
        const setPause = document.getElementById("setPause");
        const trainingHeader = document.getElementById("trainingHeader");
        const topHeader = document.getElementById("topHeader");
        const mainHeader = document.getElementById("mainHeader");
        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resumeBtn = document.getElementById("resumeBtn");
        const resetBtn = document.getElementById("resetBtn");
        const settingsDiv = document.getElementById("settings");
        
        function save() {
            localStorage.setItem("work", work.value);
            localStorage.setItem("rest", rest.value);
            localStorage.setItem("rounds", rounds.value);
            localStorage.setItem("sets", sets.value);
            localStorage.setItem("setPause", setPause.value);
        }
        
        function load() {
            if(localStorage.work) work.value = localStorage.work;
            if(localStorage.rest) rest.value = localStorage.rest;
            if(localStorage.rounds) rounds.value = localStorage.rounds;
            if(localStorage.sets) sets.value = localStorage.sets;
            if(localStorage.setPause) setPause.value = localStorage.setPause;
        }
        
        load();
        
        function say(text) {
            if("speechSynthesis" in window) {
                let s = new SpeechSynthesisUtterance(text);
                s.lang = "de-DE";
                speechSynthesis.speak(s);
            }
        }
        
        function buzz() {
            if(navigator.vibrate) {
                navigator.vibrate(300);
            }
        }
        
        async function keepScreenOn() {
            try {
                if("wakeLock" in navigator) {
                    wakeLock = await navigator.wakeLock.request("screen");
                }
            } catch(err) {
                console.log("Wake Lock nicht verfügbar");
            }
        }
        
        function releaseScreenLock() {
            if(wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }
        
        function update() {
            document.getElementById("timer").innerHTML = seconds;
            document.getElementById("info").innerHTML = "Wiederholung " + round + " / " + rounds.value + "<br>Satz " + set + " / " + sets.value;
            
            if(phase === "work") {
                document.body.style.background = "#28a745";
                settingsDiv.style.background = "#28a745";
                document.getElementById("phase").innerHTML = "ÜBUNGSDAUER";
            } else if(phase === "rest") {
                document.body.style.background = "#b02a37";
                settingsDiv.style.background = "#b02a37";
                document.getElementById("phase").innerHTML = "PAUSE";
            } else if(phase === "setpause") {
                document.body.style.background = "#ff6900";
                settingsDiv.style.background = "#ff6900";
                document.getElementById("phase").innerHTML = "SATZPAUSE";
            }
        }
        
        function updateCountdown() {
            document.getElementById("timer").innerHTML = countdownSeconds;
            document.getElementById("phase").innerHTML = "VORBEREITUNG";
            document.getElementById("info").innerHTML = "Training startet in...";
            document.body.style.background = "#0d6efd";
            settingsDiv.style.background = "#0d6efd";
        }
        
        function countdownTick() {
            countdownSeconds--;
            if(countdownSeconds > 0) {
                if(countdownSeconds <= 5) {
                    say(countdownSeconds);
                }
                updateCountdown();
            } else {
                clearInterval(timer);
                inCountdown = false;
                buzz();
                say("Los");
                phase = "work";
                seconds = parseInt(work.value);
                update();
                timer = setInterval(countDown, 1000);
            }
        }
        
        function countDown() {
            seconds--;
            if(seconds <= 5 && seconds > 0) {
                say(seconds);
            }
            if(seconds <= 0) {
                buzz();
                if(phase === "work") {
                    // Nach Übungsdauer: Pause oder Satzpause?
                    if(round >= parseInt(rounds.value)) {
                        // Satz fertig
                        if(set >= parseInt(sets.value)) {
                            // Alle Sätze fertig
                            stopTimer();
                            say("Training beendet");
                            document.getElementById("phase").innerHTML = "FERTIG";
                            return;
                        } else {
                            // Satzpause
                            phase = "setpause";
                            seconds = parseInt(setPause.value);
                            say("Satzpause");
                            round = 1;
                        }
                    } else {
                        // Nächste Wiederholung
                        phase = "rest";
                        seconds = parseInt(rest.value);
                        say("Pause");
                    }
                } else if(phase === "rest") {
                    // Nach Pause: nächste Wiederholung
                    round++;
                    phase = "work";
                    seconds = parseInt(work.value);
                    say("Los");
                } else if(phase === "setpause") {
                    // Nach Satzpause: nächster Satz
                    set++;
                    phase = "work";
                    seconds = parseInt(work.value);
                    say("Los");
                }
            }
            update();
        }
        
        function startTimer() {
            if(running) return;
            save();
            running = true;
            paused = false;
            keepScreenOn();
            startBtn.classList.add("hidden");
            pauseBtn.classList.remove("hidden");
            resumeBtn.classList.add("hidden");
            resetBtn.classList.remove("hidden");
            trainingHeader.style.display = "block";
            topHeader.style.display = "none";
            mainHeader.classList.add("hidden");
            settingsDiv.classList.remove("hidden");
            document.getElementById("phase").classList.remove("hidden");
            document.getElementById("timer").classList.remove("hidden");
            document.getElementById("info").classList.remove("hidden");
            inCountdown = true;
            countdownSeconds = 10;
            updateCountdown();
            timer = setInterval(countdownTick, 1000);
        }
        
        function pauseTimer() {
            running = false;
            paused = true;
            clearInterval(timer);
            pauseBtn.classList.add("hidden");
            resumeBtn.classList.remove("hidden");
        }
        
        function resumeTimer() {
            running = true;
            paused = false;
            pauseBtn.classList.remove("hidden");
            resumeBtn.classList.add("hidden");
            timer = setInterval(countDown, 1000);
        }
        
        function stopTimer() {
            running = false;
            clearInterval(timer);
        }
        
        function resetTimer() {
            stopTimer();
            releaseScreenLock();
            phase = "work";
            round = 1;
            set = 1;
            seconds = parseInt(work.value);
            inCountdown = false;
            paused = false;
            startBtn.classList.remove("hidden");
            pauseBtn.classList.add("hidden");
            resumeBtn.classList.add("hidden");
            resetBtn.classList.add("hidden");
            trainingHeader.style.display = "none";
            topHeader.style.display = "block";
            mainHeader.classList.remove("hidden");
            settingsDiv.classList.remove("hidden");
            document.getElementById("phase").classList.add("hidden");
            document.getElementById("timer").classList.add("hidden");
            document.getElementById("info").classList.add("hidden");
            update();
        }
        
        seconds = parseInt(work.value);
        update();
    </script>
</body>
</html>
