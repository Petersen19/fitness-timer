<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Timer</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d3d0d;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 95%;
            text-align: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h2 {
            font-size: 28px;
            margin: 5px 0;
            font-family: Arial, sans-serif;
        }
        .header p {
            font-size: 20px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .settings {
            background: #222;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
        }
        input {
            width: 80px;
            font-size: 22px;
            text-align: center;
            padding: 8px;
        }
        .training-header {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            display: none;
        }
        .training-header h2 {
            font-size: 28px;
            margin: 5px 0;
            font-family: Arial, sans-serif;
        }
        .training-header p {
            font-size: 20px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        #phase {
            font-size: 42px;
            font-weight: bold;
            margin-top: 20px;
        }
        #timer {
            font-size: 120px;
            font-weight: bold;
        }
        #round {
            font-size: 30px;
        }
        button {
            font-size: 22px;
            padding: 15px 25px;
            margin: 8px;
            border-radius: 12px;
            border: 0;
        }
        .start {
            background: #0d47a1;
            color: white;
        }
        .pause {
            background: #ffc107;
        }
        .reset {
            background: #dc3545;
            color: white;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="training-header" id="trainingHeader">
        <h2>Fitness Timer</h2>
        <p>by Petersen19</p>
    </div>
    <div class="container">
        <div class="header" id="mainHeader">
            <h2>Fitness Timer</h2>
            <p>by Petersen19</p>
        </div>
        <div id="settings" class="settings">
            Übungsdauer Sekunden<br>
            <input id="work" value="20" type="number">
            <br><br>
            Pause Sekunden<br>
            <input id="rest" value="45" type="number">
            <br><br>
            Wiederholungen<br>
            <input id="rounds" value="20" type="number">
        </div>
        <div id="phase" class="hidden">BEREIT</div>
        <div id="timer" class="hidden">20</div>
        <div id="round" class="hidden">Wiederholung 1 / 20</div>
        <button class="start" id="startBtn" onclick="startTimer()">START</button>
        <button class="pause hidden" id="pauseBtn" onclick="pauseTimer()">PAUSE</button>
        <button class="reset hidden" id="resetBtn" onclick="resetTimer()">RESET</button>
    </div>
    <script>
        let phase = "work";
        let seconds = 20;
        let round = 1;
        let running = false;
        let timer = null;
        let wakeLock = null;
        let inCountdown = false;
        let countdownSeconds = 30;
        
        const work = document.getElementById("work");
        const rest = document.getElementById("rest");
        const rounds = document.getElementById("rounds");
        const trainingHeader = document.getElementById("trainingHeader");
        const mainHeader = document.getElementById("mainHeader");
        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resetBtn = document.getElementById("resetBtn");
        
        function save() {
            localStorage.setItem("work", work.value);
            localStorage.setItem("rest", rest.value);
            localStorage.setItem("rounds", rounds.value);
        }
        
        function load() {
            if(localStorage.work) work.value = localStorage.work;
            if(localStorage.rest) rest.value = localStorage.rest;
            if(localStorage.rounds) rounds.value = localStorage.rounds;
        }
        
        load();
        
        function say(text) {
            if("speechSynthesis" in window) {
                let s = new SpeechSynthesisUtterance(text);
                s.lang = "de-DE";
                speechSynthesis.speak(s);
            }
        }
        
        function buzz() {
            if(navigator.vibrate) {
                navigator.vibrate(300);
            }
        }
        
        async function keepScreenOn() {
            try {
                if("wakeLock" in navigator) {
                    wakeLock = await navigator.wakeLock.request("screen");
                }
            } catch(err) {
                console.log("Wake Lock nicht verfügbar");
            }
        }
        
        function releaseScreenLock() {
            if(wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }
        
        function update() {
            document.getElementById("timer").innerHTML = seconds;
            document.getElementById("round").innerHTML = "Wiederholung " + round + " / " + rounds.value;
            
            if(phase === "work") {
                document.body.style.background = "#198754";
                document.getElementById("phase").innerHTML = "ÜBUNGSDAUER";
            } else {
                document.body.style.background = "#b02a37";
                document.getElementById("phase").innerHTML = "PAUSE";
            }
        }
        
        function updateCountdown() {
            document.getElementById("timer").innerHTML = countdownSeconds;
            document.getElementById("phase").innerHTML = "VORBEREITUNG";
            document.getElementById("round").innerHTML = "Training startet in...";
            document.body.style.background = "#0d6efd";
        }
        
        function countdownTick() {
            countdownSeconds--;
            if(countdownSeconds > 0) {
                if(countdownSeconds <= 5) {
                    say(countdownSeconds);
                }
                updateCountdown();
            } else {
                clearInterval(timer);
                inCountdown = false;
                buzz();
                say("Los");
                phase = "work";
                seconds = parseInt(work.value);
                update();
                timer = setInterval(countDown, 1000);
            }
        }
        
        function countDown() {
            seconds--;
            if(seconds <= 5 && seconds > 0) {
                say(seconds);
            }
            if(seconds <= 0) {
                buzz();
                if(phase === "work") {
                    phase = "rest";
                    seconds = parseInt(rest.value);
                    say("Pause");
                } else {
                    if(round >= parseInt(rounds.value)) {
                        stopTimer();
                        say("Training beendet");
                        document.getElementById("phase").innerHTML = "FERTIG";
                        return;
                    }
                    round++;
                    phase = "work";
                    seconds = parseInt(work.value);
                    say("Los");
                }
            }
            update();
        }
        
        function startTimer() {
            if(running) return;
            save();
            running = true;
            keepScreenOn();
            startBtn.classList.add("hidden");
            pauseBtn.classList.remove("hidden");
            resetBtn.classList.remove("hidden");
            trainingHeader.style.display = "block";
            mainHeader.classList.add("hidden");
            document.getElementById("settings").classList.add("hidden");
            document.getElementById("phase").classList.remove("hidden");
            document.getElementById("timer").classList.remove("hidden");
            document.getElementById("round").classList.remove("hidden");
            inCountdown = true;
            countdownSeconds = 30;
            updateCountdown();
            timer = setInterval(countdownTick, 1000);
        }
        
        function pauseTimer() {
            running = false;
            clearInterval(timer);
        }
        
        function stopTimer() {
            running = false;
            clearInterval(timer);
        }
        
        function resetTimer() {
            stopTimer();
            releaseScreenLock();
            phase = "work";
            round = 1;
            seconds = parseInt(work.value);
            inCountdown = false;
            startBtn.classList.remove("hidden");
            pauseBtn.classList.add("hidden");
            resetBtn.classList.add("hidden");
            trainingHeader.style.display = "none";
            mainHeader.classList.remove("hidden");
            document.getElementById("settings").classList.remove("hidden");
            document.getElementById("phase").classList.add("hidden");
            document.getElementById("timer").classList.add("hidden");
            document.getElementById("round").classList.add("hidden");
            update();
        }
        
        seconds = parseInt(work.value);
        update();
    </script>
</body>
</html>
