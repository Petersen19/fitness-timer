<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Timer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #28a745;
            color: white;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s ease;
        }
        body.training {
            background: #28a745;
        }
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 15px;
            background: rgba(13, 71, 161, 0.95);
            z-index: 100;
        }
        .top-header h2 {
            font-size: 24px;
            margin: 5px 0;
            font-family: Arial, sans-serif;
        }
        .top-header p {
            font-size: 14px;
            margin: 2px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .container {
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #28a745;
            transition: background-color 0.3s ease;
            padding-top: 100px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            display: none;
        }
        .header h2 {
            font-size: 28px;
            margin: 5px 0;
            font-family: Arial, sans-serif;
        }
        .header p {
            font-size: 20px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .settings {
            background: #28a745;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 3px solid #0d47a1;
            width: 85%;
            max-width: 270px;
            margin-left: auto;
            margin-right: auto;
        }
        .setting-row {
            margin-bottom: 10px;
        }
        .setting-label {
            font-size: 13px;
            margin-bottom: 3px;
            display: block;
        }
        input[type="number"] {
            width: 65px;
            font-size: 18px;
            text-align: center;
            padding: 6px;
        }
        .training-duration-display {
            font-size: 15px;
            font-weight: bold;
            color: #ffc107;
            margin-top: 10px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .sound-toggle-main {
            background: #17a2b8;
            color: white;
            font-size: 15px;
            padding: 10px 15px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }
        .sound-toggle-main.muted {
            background: #6c757d;
        }
        .sound-toggle-main:active {
            transform: scale(0.98);
        }
        .training-header {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            display: none;
        }
        .training-header h2 {
            font-size: 28px;
            margin: 5px 0;
            font-family: Arial, sans-serif;
        }
        .training-header p {
            font-size: 20px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        #phase {
            font-size: 42px;
            font-weight: bold;
            margin-top: 20px;
        }
        #timer {
            font-size: 120px;
            font-weight: bold;
        }
        #info {
            font-size: 30px;
            line-height: 1.8;
        }
        button {
            font-size: 22px;
            padding: 15px 25px;
            margin: 8px;
            border-radius: 12px;
            border: 0;
        }
        .start {
            background: #0d47a1;
            color: white;
        }
        .pause {
            background: #ffc107;
        }
        .resume {
            background: #28a745;
            color: white;
        }
        .reset {
            background: #dc3545;
            color: white;
        }
        .sound-toggle-training {
            background: #17a2b8;
            color: white;
            font-size: 18px;
            padding: 12px 20px;
            position: fixed;
            top: 100px;
            right: 15px;
            z-index: 99;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        .sound-toggle-training.muted {
            background: #6c757d;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="top-header" id="topHeader">
        <h2>Fitness Timer</h2>
        <p>by Petersen19</p>
    </div>
    <div class="training-header" id="trainingHeader">
        <h2>Fitness Timer</h2>
        <p>by Petersen19</p>
    </div>
    <button class="sound-toggle-training hidden" id="soundToggleTraining" onclick="toggleSound()">🔊 Sound AN</button>
    <div class="container">
        <div class="header" id="mainHeader">
            <h2>Fitness Timer</h2>
            <p>by Petersen19</p>
        </div>
        <div id="settings" class="settings">
            <div class="setting-row">
                <span class="setting-label">Übungsdauer Sekunden</span>
                <input id="work" value="20" type="number" inputmode="numeric" onchange="calculateDuration()" oninput="calculateDuration()">
            </div>
            <div class="setting-row">
                <span class="setting-label">Pause Sekunden</span>
                <input id="rest" value="45" type="number" inputmode="numeric" onchange="calculateDuration()" oninput="calculateDuration()">
            </div>
            <div class="setting-row">
                <span class="setting-label">Wiederholungen</span>
                <input id="rounds" value="20" type="number" inputmode="numeric" onchange="calculateDuration()" oninput="calculateDuration()">
            </div>
            <div class="setting-row">
                <span class="setting-label">Sätze</span>
                <input id="sets" value="3" type="number" inputmode="numeric" onchange="calculateDuration()" oninput="calculateDuration()">
            </div>
            <div class="setting-row">
                <span class="setting-label">Satzpause Sekunden</span>
                <input id="setPause" value="60" type="number" inputmode="numeric" onchange="calculateDuration()" oninput="calculateDuration()">
            </div>
            <div class="training-duration-display">
                Trainingsdauer: <span id="durationDisplay">00:00</span>
            </div>
            <button class="sound-toggle-main" id="soundToggleMain" onclick="toggleSound()">🔊 Sound AN</button>
        </div>
        <div id="phase" class="hidden">BEREIT</div>
        <div id="timer" class="hidden">20</div>
        <div id="info" class="hidden">Wiederholung 1 / 20<br>Satz 1 / 3</div>
        <button class="start" id="startBtn" onclick="startTimer()">START</button>
        <button class="pause hidden" id="pauseBtn" onclick="pauseTimer()">PAUSE</button>
        <button class="resume hidden" id="resumeBtn" onclick="resumeTimer()">FORTSETZEN</button>
        <button class="reset hidden" id="resetBtn" onclick="resetTimer()">RESET</button>
    </div>
    <script>
        let phase = "work"; // work, rest, setpause
        let seconds = 20;
        let round = 1;
        let set = 1;
        let running = false;
        let paused = false;
        let timer = null;
        let wakeLock = null;
        let inCountdown = false;
        let countdownSeconds = 10;
        let soundEnabled = true;
        let audioContext = null;
        
        const work = document.getElementById("work");
        const rest = document.getElementById("rest");
        const rounds = document.getElementById("rounds");
        const sets = document.getElementById("sets");
        const setPause = document.getElementById("setPause");
        const trainingHeader = document.getElementById("trainingHeader");
        const topHeader = document.getElementById("topHeader");
        const mainHeader = document.getElementById("mainHeader");
        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resumeBtn = document.getElementById("resumeBtn");
        const resetBtn = document.getElementById("resetBtn");
        const soundToggleMain = document.getElementById("soundToggleMain");
        const soundToggleTraining = document.getElementById("soundToggleTraining");
        const settingsDiv = document.getElementById("settings");
        const container = document.querySelector(".container");
        const durationDisplay = document.getElementById("durationDisplay");
        
        // Initialize AudioContext
        function initAudioContext() {
            if(!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if(audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        }
        
        // Play a beep tone
        function playBeep(frequency, duration) {
            if(!soundEnabled) return;
            
            try {
                let ctx = initAudioContext();
                let oscillator = ctx.createOscillator();
                let gainNode = ctx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                
                oscillator.start(ctx.currentTime);
                oscillator.stop(ctx.currentTime + duration);
            } catch(e) {
                console.error("Audio error:", e);
            }
        }
        
        // Countdown: 3, 2, 1 - ein kurzer Pieps für jede Zahl
        function playCountdown(number) {
            if(!soundEnabled) return;
            playBeep(800, 0.1); // Kurzer Pieps
        }
        
        // Start: 1 längerer höherer Pieps
        function playStart() {
            if(!soundEnabled) return;
            playBeep(1000, 0.3); // Höherer, längerer Ton
        }
        
        // Go: 1 längerer höherer Pieps
        function playGo() {
            if(!soundEnabled) return;
            playBeep(1000, 0.3); // Höherer, längerer Ton
        }
        
        // Stop: 1 längerer tieferer Pieps
        function playStop() {
            if(!soundEnabled) return;
            playBeep(400, 0.3); // Tieferer, längerer Ton
        }
        
        // Break: 2 längere Pieps
        function playBreak() {
            if(!soundEnabled) return;
            playBeep(600, 0.25); // Erster längerer Ton
            setTimeout(() => playBeep(600, 0.25), 300); // Zweiter längerer Ton
        }
        
        // Finish: mehrere höhere Pieps
        function playFinish() {
            if(!soundEnabled) return;
            for(let i = 0; i < 3; i++) {
                setTimeout(() => playBeep(1200, 0.15), i * 200);
            }
        }
        
        function calculateDuration() {
            // Werte auslesen
            const workSeconds = parseInt(work.value) || 0;
            const restSeconds = parseInt(rest.value) || 0;
            const numRounds = parseInt(rounds.value) || 0;
            const numSets = parseInt(sets.value) || 0;
            const setPauseSeconds = parseInt(setPause.value) || 0;
            
            // Berechnung: (Übungsdauer + Pause) × Wiederholungen × Sätze + (Satzpause × (Sätze - 1))
            let durationPerSet = (workSeconds * numRounds) + (restSeconds * (numRounds - 1));
            let totalDuration = (durationPerSet * numSets) + (setPauseSeconds * (numSets - 1));
            
            // In Minuten und Sekunden umwandeln
            const minutes = Math.floor(totalDuration / 60);
            const secs = totalDuration % 60;
            
            // Format: MM:SS
            const formattedDuration = String(minutes).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            durationDisplay.textContent = formattedDuration;
        }
        
        function save() {
            localStorage.setItem("work", work.value);
            localStorage.setItem("rest", rest.value);
            localStorage.setItem("rounds", rounds.value);
            localStorage.setItem("sets", sets.value);
            localStorage.setItem("setPause", setPause.value);
        }
        
        function load() {
            if(localStorage.work) work.value = localStorage.work;
            if(localStorage.rest) rest.value = localStorage.rest;
            if(localStorage.rounds) rounds.value = localStorage.rounds;
            if(localStorage.sets) sets.value = localStorage.sets;
            if(localStorage.setPause) setPause.value = localStorage.setPause;
            calculateDuration();
        }
        
        load();
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const newText = soundEnabled ? "🔊 Sound AN" : "🔇 Sound AUS";
            const newClass = soundEnabled ? "" : "muted";
            
            // Update both buttons
            soundToggleMain.textContent = newText;
            soundToggleMain.className = "sound-toggle-main " + newClass;
            
            soundToggleTraining.textContent = newText;
            soundToggleTraining.className = "sound-toggle-training " + newClass;
        }
        
        function buzz() {
            if(navigator.vibrate) {
                navigator.vibrate(300);
            }
        }
        
        async function keepScreenOn() {
            try {
                if("wakeLock" in navigator) {
                    wakeLock = await navigator.wakeLock.request("screen");
                }
            } catch(err) {
                console.log("Wake Lock nicht verfügbar");
            }
        }
        
        function releaseScreenLock() {
            if(wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }
        
        function update() {
            document.getElementById("timer").innerHTML = seconds;
            document.getElementById("info").innerHTML = "Wiederholung " + round + " / " + rounds.value + "<br>Satz " + set + " / " + sets.value;
            
            if(phase === "work") {
                document.body.style.background = "#28a745";
                container.style.background = "#28a745";
                document.getElementById("phase").innerHTML = "ÜBUNGSDAUER";
            } else if(phase === "rest") {
                document.body.style.background = "#b02a37";
                container.style.background = "#b02a37";
                document.getElementById("phase").innerHTML = "PAUSE";
            } else if(phase === "setpause") {
                document.body.style.background = "#ff6900";
                container.style.background = "#ff6900";
                document.getElementById("phase").innerHTML = "SATZPAUSE";
            }
        }
        
        function updateCountdown() {
            document.getElementById("timer").innerHTML = countdownSeconds;
            document.getElementById("phase").innerHTML = "VORBEREITUNG";
            document.getElementById("info").innerHTML = "Training startet in...";
            document.body.style.background = "#0d6efd";
            container.style.background = "#0d6efd";
        }
        
        function countdownTick() {
            countdownSeconds--;
            if(countdownSeconds > 0) {
                if(countdownSeconds <= 3) {
                    playCountdown(countdownSeconds);
                }
                updateCountdown();
            } else {
                clearInterval(timer);
                inCountdown = false;
                buzz();
                playStart();
                phase = "work";
                seconds = parseInt(work.value);
                update();
                timer = setInterval(countDown, 1000);
            }
        }
        
        function countDown() {
            seconds--;
            if(seconds <= 3 && seconds > 0) {
                playCountdown(seconds);
            }
            if(seconds <= 0) {
                buzz();
                if(phase === "work") {
                    // Nach Übungsdauer: Pause oder Satzpause?
                    if(round >= parseInt(rounds.value)) {
                        // Satz fertig
                        if(set >= parseInt(sets.value)) {
                            // Alle Sätze fertig - allerletzte Belastung
                            playFinish();
                            stopTimer();
                            document.getElementById("phase").innerHTML = "FERTIG";
                            return;
                        } else {
                            // Letzte Belastung vor Satzpause
                            playBreak();
                            phase = "setpause";
                            seconds = parseInt(setPause.value);
                            round = 1;
                        }
                    } else {
                        // Normale Belastung beendet - Pause folgt
                        playStop();
                        phase = "rest";
                        seconds = parseInt(rest.value);
                    }
                } else if(phase === "rest") {
                    // Nach Pause: nächste Wiederholung
                    playGo();
                    round++;
                    phase = "work";
                    seconds = parseInt(work.value);
                } else if(phase === "setpause") {
                    // Nach Satzpause: nächster Satz
                    playStart();
                    set++;
                    phase = "work";
                    seconds = parseInt(work.value);
                }
            }
            update();
        }
        
        function startTimer() {
            if(running) return;
            save();
            running = true;
            paused = false;
            keepScreenOn();
            initAudioContext();
            startBtn.classList.add("hidden");
            pauseBtn.classList.remove("hidden");
            resumeBtn.classList.add("hidden");
            resetBtn.classList.remove("hidden");
            soundToggleTraining.classList.remove("hidden");
            trainingHeader.style.display = "block";
            topHeader.style.display = "none";
            mainHeader.classList.add("hidden");
            settingsDiv.style.display = "none";
            document.getElementById("phase").classList.remove("hidden");
            document.getElementById("timer").classList.remove("hidden");
            document.getElementById("info").classList.remove("hidden");
            inCountdown = true;
            countdownSeconds = 10;
            updateCountdown();
            timer = setInterval(countdownTick, 1000);
        }
        
        function pauseTimer() {
            running = false;
            paused = true;
            clearInterval(timer);
            pauseBtn.classList.add("hidden");
            resumeBtn.classList.remove("hidden");
        }
        
        function resumeTimer() {
            running = true;
            paused = false;
            pauseBtn.classList.remove("hidden");
            resumeBtn.classList.add("hidden");
            timer = setInterval(countDown, 1000);
        }
        
        function stopTimer() {
            running = false;
            clearInterval(timer);
        }
        
        function resetTimer() {
            stopTimer();
            releaseScreenLock();
            phase = "work";
            round = 1;
            set = 1;
            seconds = parseInt(work.value);
            inCountdown = false;
            paused = false;
            startBtn.classList.remove("hidden");
            pauseBtn.classList.add("hidden");
            resumeBtn.classList.add("hidden");
            resetBtn.classList.add("hidden");
            soundToggleTraining.classList.add("hidden");
            trainingHeader.style.display = "none";
            topHeader.style.display = "block";
            mainHeader.classList.remove("hidden");
            settingsDiv.style.display = "block";
            document.getElementById("phase").classList.add("hidden");
            document.getElementById("timer").classList.add("hidden");
            document.getElementById("info").classList.add("hidden");
            update();
        }
        
        seconds = parseInt(work.value);
        update();
    </script>
</body>
</html>
